<form hx-post="{% if transaction %}{% url 'transaction_update' transaction.pk %}{% else %}{% url 'transaction_create' %}{% endif %}" 
      hx-target="#transaction-table-body" 
      @submit="open = false">
    <!-- Header -->
    <div class="flex items-center justify-between pb-4 mb-5 border-b border-surface-border">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center">
                <i data-lucide="wallet" class="w-4 h-4"></i>
            </div>
            <h3 class="text-lg font-semibold font-display text-slate-900">{% if transaction %}Editar Transação{% else %}Nova Transação{% endif %}</h3>
        </div>
        <button type="button" @click="open = false" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>
    
    {% csrf_token %}
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {% for field in form %}
        <div class="{% if field.name == 'description' or field.name == 'sale' %}sm:col-span-2{% endif %}">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-500 text-xs mt-1 font-medium">{{ field.errors.0 }}</p>
            {% endif %}
            {% if field.help_text %}
            <p class="text-slate-400 text-xs mt-1">{{ field.help_text }}</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <div class="mt-6 pt-4 border-t border-surface-border flex items-center justify-end gap-3">
        <button type="button" @click="open = false" class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition-colors cursor-pointer">
            Cancelar
        </button>
        <button type="submit" class="inline-flex items-center gap-2 px-5 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 active:bg-brand-800 rounded-lg shadow-sm transition-all duration-200 cursor-pointer">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span>Salvar Transação</span>
        </button>
    </div>
</form>
