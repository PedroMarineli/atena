<div id="messages" hx-swap-oob="true" class="space-y-3">
    {% for message in messages %}
    <div x-data="{ show: true }" 
         x-show="show" 
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-2"
         class="flex items-center justify-between p-4 rounded-xl border shadow-sm transition-all
         {% if message.tags == 'error' %}
             bg-rose-50 border-rose-200 text-rose-800
         {% elif message.tags == 'success' %}
             bg-emerald-50 border-emerald-200 text-emerald-800
         {% elif message.tags == 'warning' %}
             bg-amber-50 border-amber-200 text-amber-800
         {% else %}
             bg-indigo-50 border-indigo-200 text-indigo-800
         {% endif %}">
        <div class="flex items-center gap-3">
            <div class="p-1 rounded-lg flex-shrink-0
                {% if message.tags == 'error' %}
                    bg-rose-100 text-rose-600
                {% elif message.tags == 'success' %}
                    bg-emerald-100 text-emerald-600
                {% elif message.tags == 'warning' %}
                    bg-amber-100 text-amber-600
                {% else %}
                    bg-indigo-100 text-indigo-600
                {% endif %}">
                {% if message.tags == 'error' %}
                    <i data-lucide="alert-octagon" class="w-5 h-5"></i>
                {% elif message.tags == 'success' %}
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                {% elif message.tags == 'warning' %}
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                {% else %}
                    <i data-lucide="info" class="w-5 h-5"></i>
                {% endif %}
            </div>
            <p class="text-xs sm:text-sm font-medium">{{ message }}</p>
        </div>
        <button @click="show = false" type="button" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>
    {% endfor %}
</div>
