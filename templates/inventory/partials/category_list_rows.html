{% for category in categories %}
<tr class="hover:bg-slate-50/75 transition-colors group">
    <td class="py-4 px-6">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-brand-50 border border-brand-100 text-brand-600 flex items-center justify-center shrink-0">
                <i data-lucide="tag" class="w-4 h-4"></i>
            </div>
            <span class="font-medium text-slate-900">{{ category.name }}</span>
        </div>
    </td>
    <td class="py-4 px-6 text-right">
        <div class="flex items-center justify-end gap-1.5">
            <button hx-get="{% url 'category_update' category.pk %}" 
                    hx-target="#modal-content" 
                    @click="open = true"
                    title="Editar Categoria"
                    class="p-1.5 rounded-lg text-slate-500 hover:text-brand-600 hover:bg-brand-50 transition-colors cursor-pointer">
                <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button hx-delete="{% url 'category_delete' category.pk %}" 
                    hx-confirm="Tem certeza que deseja excluir esta categoria?" 
                    hx-target="#category-table-body" 
                    title="Excluir Categoria"
                    class="p-1.5 rounded-lg text-slate-500 hover:text-red-600 hover:bg-red-50 transition-colors cursor-pointer">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="2" class="py-12 px-6 text-center text-slate-500">
        <div class="flex flex-col items-center justify-center">
            <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-3">
                <i data-lucide="tags" class="w-6 h-6"></i>
            </div>
            <p class="font-medium text-slate-700">Nenhuma categoria cadastrada</p>
            <p class="text-xs text-slate-400 mt-1">Crie categorias para organizar seus produtos no catálogo.</p>
        </div>
    </td>
</tr>
{% endfor %}
