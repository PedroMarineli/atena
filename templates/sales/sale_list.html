{% extends 'base.html' %}

{% block breadcrumb %}Vendas & Pedidos{% endblock %}

{% block content %}
<div x-data="{ open: false }" class="space-y-6">
    <!-- Header Toolbar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Vendas & Pedidos</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Gerencie orçamentos, pedidos de venda e faturamento</p>
        </div>
        <div>
            <button hx-get="{% url 'sale_create' %}" 
                    hx-target="#modal-content" 
                    @click="open = true" 
                    class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold shadow-sm shadow-brand-500/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Nova Venda</span>
            </button>
        </div>
    </div>

    <!-- Table Container -->
    <div class="bg-white border border-slate-200/80 rounded-2xl shadow-soft overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50/80 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                        <th class="py-3.5 px-4 sm:px-6">Código</th>
                        <th class="py-3.5 px-4 sm:px-6">Cliente</th>
                        <th class="py-3.5 px-4 sm:px-6">Vendedor</th>
                        <th class="py-3.5 px-4 sm:px-6">Data</th>
                        <th class="py-3.5 px-4 sm:px-6">Valor Total</th>
                        <th class="py-3.5 px-4 sm:px-6">Status</th>
                        <th class="py-3.5 px-4 sm:px-6 text-right">Ações</th>
                    </tr>
                </thead>
                <tbody id="sale-table-body" class="divide-y divide-slate-100 text-xs sm:text-sm">
                    {% include 'sales/partials/sale_list_rows.html' %}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modern Responsive Modal Dialog -->
    <div x-show="open" 
         x-cloak
         class="fixed inset-0 z-50 overflow-y-auto"
         style="display: none;">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm transition-opacity" 
             @click="open = false"
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"></div>

        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 w-full max-w-lg border border-slate-200"
                 x-transition:enter="ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                 x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                 x-transition:leave="ease-in duration-200"
                 x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                 x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95">
                
                <div class="p-6" id="modal-content">
                    <!-- Loaded via HTMX -->
                    <div class="flex items-center justify-center py-8 text-slate-400">
                        <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
