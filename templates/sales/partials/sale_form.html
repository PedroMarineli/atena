<form hx-post="{% if sale %}{% url 'sale_update' sale.pk %}{% else %}{% url 'sale_create' %}{% endif %}" 
      hx-target="#sale-table-body" 
      @submit="open = false"
      class="space-y-5">
    
    <div class="flex items-center justify-between pb-3 border-b border-slate-200">
        <div>
            <h3 class="text-lg font-bold text-slate-900">
                {% if sale %}Editar Pedido de Venda{% else %}Novo Pedido de Venda{% endif %}
            </h3>
            <p class="text-xs text-slate-500">Selecione o cliente para iniciar a venda</p>
        </div>
        <button type="button" @click="open = false" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>
    
    {% csrf_token %}
    
    <div class="space-y-4">
        {% for field in form %}
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <p class="text-rose-600 text-xs mt-1 font-medium">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <div class="pt-4 border-t border-slate-200 flex justify-end gap-2.5">
        <button type="button" @click="open = false" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-50 transition-colors">
            Cancelar
        </button>
        <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold shadow-sm shadow-brand-500/20 transition-all">
            Salvar e Prosseguir
        </button>
    </div>
</form>
