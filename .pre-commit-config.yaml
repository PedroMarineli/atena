# =============================================================================
# DevSecOps Pre-Commit Hooks Configuration
# Prevents secret leaks, credential exposure, and syntax errors at commit time.
# =============================================================================
repos:
  # 1. Gitleaks Secret Scanner
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # 2. General Code Hygiene & Configuration validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # 3. Python Security (Bandit SAST)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml', '-r', '.']
        additional_dependencies: ["bandit[toml]"]
