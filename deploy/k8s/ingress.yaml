apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atena-ingress
  namespace: atena
  labels:
    app.kubernetes.io/name: atena
    app.kubernetes.io/part-of: atena-erp
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: atena.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atena-service
                port:
                  number: 8000
